name: NoAI Cow hurt/control observations 26.3

on:
  push:
    branches: ['wip/noai-hurt-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: noai-hurt-checks-26.3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check orchestration without Minecraft
        run: |
          mkdir -p "$RUNNER_TEMP/noai-hurt-output"
          node --test tools/blackbox/*.test.js 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/node-blackbox-tests.log"
          python -m unittest discover -s tools/blackbox -p test_combat_ci.py -v 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/orchestration-tests.log"
          python -m unittest discover -s tools/blackbox -p test_noai_hurt.py -v 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/noai-hurt-tests.log"
          python -m unittest discover -s tools/blackbox -p test_record777.py -v 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/recorder-tests.log"
          node --check tools/blackbox/replay777.js 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/node-replay-syntax.log"
          node --check tools/blackbox/compare.js 2>&1 | tee "$RUNNER_TEMP/noai-hurt-output/node-compare-syntax.log"
      - name: Resolve and verify exact successful build
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/blackbox/noai_hurt_ci.py pin --output "$RUNNER_TEMP/noai-hurt-output"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pin.outputs.build_run_id }}
          name: ${{ steps.pin.outputs.artifact_name }}
          path: ${{ runner.temp }}/noai-hurt-build-artifact
      - name: Record bounded series; audit valid observations; preserve strict diagnostics
        timeout-minutes: 20
        run: |
          python tools/blackbox/noai_hurt_ci.py run \
            --artifact "$RUNNER_TEMP/noai-hurt-build-artifact" \
            --work "$RUNNER_TEMP/noai-hurt-work" \
            --output "$RUNNER_TEMP/noai-hurt-output" \
            --java "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noai-hurt-777-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noai-hurt-output/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
