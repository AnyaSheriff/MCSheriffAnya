name: Mob paired observations 777
on:
  push:
    branches: [test/mob-blackbox-20261114]
  workflow_dispatch:
    inputs:
      suite:
        description: Run all descriptions in eight shards (only after reviewed preflight)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - id: plan
        env:
          FULL_SUITE: ${{ inputs.suite || false }}
        run: |
          if [ "$FULL_SUITE" = true ]; then
            echo 'matrix=[0,1,2,3,4,5,6,7]' >> "$GITHUB_OUTPUT"
            echo 'mode=suite' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[0]' >> "$GITHUB_OUTPUT"
            echo 'mode=preflight' >> "$GITHUB_OUTPUT"
          fi
  observe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Lightweight harness tests
        run: python3 -B -m unittest discover -s tools/blackbox/mobs -p 'test_*.py' -v
      - name: Verify existing native artifact and opaque pinned inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/blackbox/mobs/prepare_ci.py "$RUNNER_TEMP/mob-inputs" mob-evidence
      - name: Actual paired recordings and strict parity gate
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          SHARD: ${{ matrix.shard }}
        run: python3 -B tools/blackbox/mobs/suite.py run --mode "$MODE" --shard "$SHARD" --inputs "$RUNNER_TEMP/mob-inputs" --output "$RUNNER_TEMP/mob-results"
      - name: Collect only observations and receipts
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          out=pathlib.Path('mob-evidence');out.mkdir(exist_ok=True)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mob-results'
          for p in root.rglob('*'):
              relative=p.relative_to(root)
              if 'world' in relative.parts or not p.is_file() or p.suffix not in ('.json','.jsonl','.log','.md'): continue
              dest=out/'observations'/relative;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          source=out/'harness';source.mkdir(exist_ok=True)
          for p in pathlib.Path('tools/blackbox/mobs').glob('*.py'): shutil.copyfile(p,source/p.name)
          shutil.copyfile('tools/blackbox/ci/sources-777.json',out/'sources-777.json')
          shutil.copyfile('.github/workflows/mob-blackbox-checks.yml',out/'workflow.yml')
          receipt={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}}
          (out/'SHA-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobs-${{ needs.plan.outputs.mode }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mob-evidence/
          if-no-files-found: error
          retention-days: 14
