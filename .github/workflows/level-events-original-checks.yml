name: Native774 and777 level event observations
on:
  push:
    branches: [fix/dispenser-events-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check offline negative guards and exact source lock
        run: |
          python tools/fetch-release-lock.py
          python -B -m unittest discover -s tools/protocol-bridge -p test_level_events_original.py -v
      - name: Record actual original native774 and777 cases without compiling Rust
        run: |
          python -B tools/protocol-bridge/probe_level_events_original.py --output "$RUNNER_TEMP/level-events-original" --java "$JAVA_HOME/bin/java"
      - name: Retain only own sources and selected observations; no JAR/world upload
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,pathlib,hashlib,json,shutil,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'level-events-original-evidence';out.mkdir()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'level-events-original'
          for path in root.rglob('*'):
              if path.is_file() and path.name in ['observations.json','server.log','protocol.json','official-version-metadata.json']:
                  target=out/path.relative_to(root);target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
          for name in ['tools/protocol-bridge/probe_level_events_original.py','tools/protocol-bridge/test_level_events_original.py','.github/workflows/level-events-original-checks.yml','tools/protocol-bridge/probe_gameplay.py','tools/protocol-bridge/smoke.py','tools/protocol-bridge/observe.py','tools/protocol-bridge/generate_tables.py','tools/protocol-bridge/step1-sources-774.json','tools/blackbox/ci/sources-777.json','Cargo.lock']:
              source=pathlib.Path(name)
              if source.is_file():shutil.copyfile(source,out/source.name)
          files={str(p.relative_to(out)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob('*') if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'scope':'official opaque originals native774+777 only; no candidate or full gameplay claim','files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-events-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/level-events-original-evidence/
          if-no-files-found: error
