name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Test and clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets --workspace
      # Тесты плагинов грузят примеры из plugins-examples — собрать их заранее.
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
        working-directory: plugins-examples
      - run: cargo test --release --workspace
      # Закрытый Guard проверяем по подписанному публичному бинарнику.
      # Ключ подписи и исходники модуля в Actions не передаются.
      - name: Test signed Guard integration
        run: |
          guard_fixture="$RUNNER_TEMP/mcsa-guard-fixture"
          mkdir -p "$guard_fixture"
          for asset in linux-x86_64.json linux-x86_64.sig mcsa-guard-linux-x86_64; do
            curl --fail --location --retry 3 --max-time 60 \
              "https://github.com/AnyaSheriff/MCSA-Guard/releases/download/v0.1.0/$asset" \
              --output "$guard_fixture/$asset"
          done
          MCSA_GUARD_TEST_BUNDLE="$guard_fixture" cargo test --release guard_signed_module -- --ignored
      - run: cargo test --release --no-default-features

  build-other:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
