name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Test and clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets --workspace
      # Тесты плагинов грузят примеры из plugins-examples — собрать их заранее.
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
        working-directory: plugins-examples
      - run: cargo test --release --workspace
      - run: cargo test --release --no-default-features

  build-other:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
