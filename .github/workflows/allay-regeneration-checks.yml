name: Allay healing tick observations
on:
  push:
    branches: ['fix/allay-regen-20261116']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Lightweight observation tests
        run: python3 -B -m unittest discover -s tools/blackbox/mobs -p 'test_*.py'
      - name: Verify pinned previously tested runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/blackbox/mobs/prepare_allay_ci.py allay-evidence
      - name: Record both sides without pretending baseline parity
        run: python3 -B tools/blackbox/mobs/probe_allay_regeneration.py --binary allay-evidence/runtime-elf --binary-source 0a370b95005d1919832829dfe5446d6183bacdf1 --output "$RUNNER_TEMP/allay-observations"
      - name: Preserve raw observations and source receipts
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          out=pathlib.Path('allay-evidence');out.mkdir(exist_ok=True)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'allay-observations'
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in ['.json','.jsonl','.log']:
                  dest=out/'observations'/p.relative_to(root);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          # Копии миров и ELF не нужны для разбора наблюдений.
          binary=out/'runtime-elf'
          if binary.exists():binary.unlink()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),'HEAD'],check=True)
          files={str(p.relative_to(out)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob('*') if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files,'scope':'Recording validation only; baseline health parity can differ. Read analysis.json exact_received_health_match separately.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allay-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: allay-evidence/
          retention-days: 14
          if-no-files-found: error
