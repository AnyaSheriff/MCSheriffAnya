name: Allay healing tick observations
on:
  push:
    branches: ['fix/allay-regen-20261116']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    if: github.sha == '64d471fcc40f430b36ec372b7e584666e3bf1468'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Lightweight observation tests
        run: python3 -B -m unittest discover -s tools/blackbox/mobs -p 'test_*.py'
      - name: Verify pinned previously tested runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/blackbox/mobs/prepare_allay_ci.py allay-evidence
      - name: Record both sides without pretending baseline parity
        run: python3 -B tools/blackbox/mobs/probe_allay_regeneration.py --binary allay-evidence/runtime-elf --binary-source 0a370b95005d1919832829dfe5446d6183bacdf1 --output "$RUNNER_TEMP/allay-observations"
      - name: Preserve raw observations and source receipts
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          out=pathlib.Path('allay-evidence');out.mkdir(exist_ok=True)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'allay-observations'
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in ['.json','.jsonl','.log']:
                  dest=out/'observations'/p.relative_to(root);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          # Копии миров и ELF не нужны для разбора наблюдений.
          binary=out/'runtime-elf'
          if binary.exists():binary.unlink()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),'HEAD'],check=True)
          files={str(p.relative_to(out)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob('*') if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files,'scope':'Recording validation only; baseline health parity can differ. Read analysis.json exact_received_health_match separately.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allay-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: allay-evidence/
          retention-days: 14
          if-no-files-found: error
  source:
    if: github.sha != '64d471fcc40f430b36ec372b7e584666e3bf1468'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          key: public-container-button-source
      - name: Install previously tested dependency lock
        run: |
          mkdir -p allay-evidence
          python3 -B tools/fetch-release-lock.py
          cp Cargo.lock allay-evidence/Cargo.lock
          rustc -vV > allay-evidence/rustc.log
      - name: Observation harness tests
        run: python3 -B -m unittest discover -s tools/blackbox/mobs -p 'test_*.py'
      - name: Prepare own plugin test components
        run: |
          set -o pipefail
          python3 -B tools/protocol-bridge/public_container_button_ci.py examples-lock --output allay-evidence
          rustup target add wasm32-wasip2
          cargo build --manifest-path plugins-examples/Cargo.toml --workspace --locked --release --target wasm32-wasip2 2>&1 | tee allay-evidence/examples-build.log
          python3 -B tools/protocol-bridge/public_container_button_ci.py examples-check --output allay-evidence
      - name: Strict workspace Clippy
        run: |
          set -o pipefail
          cargo clippy --release --locked --workspace --all-targets -- -D warnings 2>&1 | tee allay-evidence/clippy.log
      - name: Full default workspace tests
        run: |
          set -o pipefail
          cargo test --release --locked --workspace 2>&1 | tee allay-evidence/default-tests.log
      - name: Full no-default workspace tests
        run: |
          set -o pipefail
          cargo test --release --locked --workspace --no-default-features 2>&1 | tee allay-evidence/no-default-tests.log
      - name: Ordinary native build
        run: |
          set -o pipefail
          cargo build --release --locked --bin mcsheriffanya 2>&1 | tee allay-evidence/build.log
          cp target/release/mcsheriffanya allay-evidence/runtime-elf
          git diff --exit-code
      - name: Exact paired received-health comparison
        timeout-minutes: 20
        run: python3 -B tools/blackbox/mobs/probe_allay_regeneration.py --binary allay-evidence/runtime-elf --binary-source "$GITHUB_SHA" --output "$RUNNER_TEMP/allay-observations" --require-match
      - name: Existing dispenser and jukebox runtime regressions
        timeout-minutes: 8
        run: python3 -B tools/protocol-bridge/probe_level_events_candidate.py --binary allay-evidence/runtime-elf --output "$RUNNER_TEMP/level-events-candidate"
      - name: Preserve source and raw verification evidence
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          out=pathlib.Path('allay-evidence');out.mkdir(exist_ok=True)
          for name in ['allay-observations','level-events-candidate']:
              root=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix in ['.json','.jsonl','.log']:
                      dest=out/name/p.relative_to(root);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),'HEAD'],check=True)
          files={str(p.relative_to(out)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob('*') if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files,'scope':'Allay natural healing with controlled NoAI received-health observations; no full gameplay/AI or latency claim.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allay-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: allay-evidence/
          retention-days: 14
          if-no-files-found: error
