name: Migration checks 26.3

on:
  push:
    branches: [migration/java-26.3, 'wip/validate-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    # Standard runner; Cargo commands run sequentially with four build workers.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare logs and Python dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/migration-checks"
          python -m pip install -r tools/measure/genaudit_263_requirements.txt 2>&1 | tee "$RUNNER_TEMP/migration-checks/python-dependencies.log"
      - name: Check measurement tools
        run: |
          python -m unittest discover -s tools/measure -p test_genaudit_263_end_edges.py -v 2>&1 | tee "$RUNNER_TEMP/migration-checks/python-end-edges.log"
          python -m unittest discover -s tools/measure -p test_ocean_263.py -v 2>&1 | tee "$RUNNER_TEMP/migration-checks/python-ocean.log"
      - name: Build plugin examples for workspace tests
        working-directory: plugins-examples
        run: cargo build --release --target wasm32-wasip2 2>&1 | tee "$RUNNER_TEMP/migration-checks/plugin-examples.log"
      - name: Test workspace
        run: cargo test --release --workspace 2>&1 | tee "$RUNNER_TEMP/migration-checks/workspace-tests.log"
      - name: Test without default features
        run: cargo test --release --no-default-features 2>&1 | tee "$RUNNER_TEMP/migration-checks/no-default-tests.log"
      - name: Check clippy without warnings
        run: cargo clippy --release --all-targets --workspace -- -D warnings 2>&1 | tee "$RUNNER_TEMP/migration-checks/clippy.log"
      - name: Build runtime
        run: cargo build --release 2>&1 | tee "$RUNNER_TEMP/migration-checks/build.log"
      - name: Record commit and artifact hashes
        if: always()
        env:
          CHECKS_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'migration-checks'
          output.mkdir(parents=True, exist_ok=True)
          paths = sorted(output.glob('*.log'))
          paths += [root / 'Cargo.lock', root / 'plugins-examples/Cargo.lock', root / 'target/release/mcsheriffanya']
          receipt = {
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'status_before_receipt': os.environ['CHECKS_STATUS'],
              'runner_os': os.environ['RUNNER_OS'],
              'cargo_build_jobs': os.environ['CARGO_BUILD_JOBS'],
              'sha256': {str(p.relative_to(root)) if p.is_relative_to(root) else p.name:
                         hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()},
              'runtime_built': (root / 'target/release/mcsheriffanya').is_file(),
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          if test -f Cargo.lock; then cp Cargo.lock "$RUNNER_TEMP/migration-checks/Cargo.lock"; fi
          if test -f plugins-examples/Cargo.lock; then cp plugins-examples/Cargo.lock "$RUNNER_TEMP/migration-checks/plugin-examples-Cargo.lock"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-checks-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/migration-checks/
            target/release/mcsheriffanya
          retention-days: 3
          if-no-files-found: error
