name: NEW instrumented Wind gap ORIGINAL-only
on:
  push:
    branches: ['probe/wind-instrumented-gap-20261110']
permissions:
  contents: read
jobs:
  original:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 -m unittest discover -s tools/blackbox -p test_wind_gap_authority_guard.py -v
      - run: python3 tools/blackbox/wind_instrumented_gap.py --output wind-instrumented-gap-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wind-instrumented-gap-${{ github.run_id }}-${{ github.run_attempt }}
          path: wind-instrumented-gap-evidence/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
