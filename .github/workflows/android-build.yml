name: Android ARM64 build

on:
  push:
    branches: ["wip/arm64-*", "wip/android-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  ANDROID_API: "24"
  ANDROID_TARGET: aarch64-linux-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk"
          tools="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$tools/aarch64-linux-android${ANDROID_API}-clang"
          cxx="$tools/aarch64-linux-android${ANDROID_API}-clang++"
          test -x "$cc"
          test -x "$cxx"
          test -x "$tools/llvm-ar"
          test -x "$tools/llvm-readelf"
          {
            echo "ANDROID_BUILD_NDK=$ndk"
            echo "ANDROID_READELF=$tools/llvm-readelf"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=$cxx"
            echo "AR_aarch64_linux_android=$tools/llvm-ar"
          } >> "$GITHUB_ENV"
          mkdir -p android-evidence
          {
            echo "source=$GITHUB_SHA"
            echo "target=$ANDROID_TARGET"
            echo "android_api=$ANDROID_API"
            echo "features=default (plugins enabled)"
            echo "runtime_test=not performed"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            cat "$ndk/source.properties"
            "$cc" --version
            rustc -Vv
            cargo -V
          } > android-evidence/build-receipt.txt

      - name: Install Rust target
        run: rustup target add "$ANDROID_TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-api24-default

      - name: Build with default WebAssembly plugins
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$ANDROID_TARGET" 2>&1 | tee android-evidence/build.log
          cp Cargo.lock android-evidence/Cargo.lock

      - name: Inspect Android executable and package
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$ANDROID_TARGET/release/mcsheriffanya"
          "$ANDROID_READELF" --file-header --program-headers --dynamic --version-info "$binary" > android-evidence/elf.txt
          python3 - "$binary" android-evidence/elf.txt <<'PY'
          import pathlib, re, struct, sys
          binary = pathlib.Path(sys.argv[1]).read_bytes()
          assert binary[:6] == b'\x7fELF\x02\x01', 'Expected ELF64 little endian'
          assert struct.unpack_from('<H', binary, 16)[0] == 3, 'Expected PIE (ET_DYN)'
          assert struct.unpack_from('<H', binary, 18)[0] == 183, 'Expected AArch64'
          text = pathlib.Path(sys.argv[2]).read_text()
          interpreters = re.findall(r'Requesting program interpreter:\s*([^\]]+)\]', text)
          assert interpreters == ['/system/bin/linker64'], interpreters
          needed = re.findall(r'\(NEEDED\).*?\[([^\]]+)\]', text)
          assert 'libc.so' in needed, needed
          allowed = {'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libandroid.so'}
          assert set(needed) <= allowed, f'Unexpected shared libraries: {needed}'
          assert 'GLIBC_' not in text, 'Unexpected glibc symbols'
          print('PASS: Android AArch64 PIE, Bionic linker and system libraries:', needed)
          PY
          name="mcsheriffanya-android-arm64-${GITHUB_SHA::7}"
          mkdir -p "android-dist/$name"
          cp "$binary" android-dist/mcsheriffanya-android-arm64
          cp "$binary" "android-dist/$name/mcsheriffanya"
          chmod 755 android-dist/mcsheriffanya-android-arm64 "android-dist/$name/mcsheriffanya"
          cp LICENSE README.md README_ru.md "android-dist/$name/"
          cp docs/android.md "android-dist/$name/ANDROID.md"
          sha256sum "$binary" >> android-evidence/build-receipt.txt
          sha256sum android-evidence/Cargo.lock android-evidence/build.log android-evidence/elf.txt >> android-evidence/build-receipt.txt
          cp android-evidence/build-receipt.txt "android-dist/$name/"
          tar -C android-dist -czf "android-dist/$name.tar.gz" "$name"
          (cd android-dist && sha256sum mcsheriffanya-android-arm64 "$name.tar.gz" > SHA256SUMS)
          (cd android-evidence && sha256sum Cargo.lock build.log elf.txt build-receipt.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-arm64-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-dist/mcsheriffanya-android-arm64
            android-dist/*.tar.gz
            android-dist/SHA256SUMS
            android-evidence/
          if-no-files-found: error

  host-http-check:
    name: Linux HTTP helper tests and strict Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-http-helper-no-default
      - name: Check helper without changing Linux TLS behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p host-http-evidence
          cargo clippy --release --all-targets --no-default-features -- -D warnings 2>&1 | tee host-http-evidence/clippy.log
          cargo test --release --no-default-features http::tests 2>&1 | tee host-http-evidence/tests.log
          cp Cargo.lock host-http-evidence/Cargo.lock
          {
            echo "source=$GITHUB_SHA"
            echo "scope=host Linux helper tests and no-default all-target Clippy"
            rustc -Vv
          } > host-http-evidence/receipt.txt
          (cd host-http-evidence && sha256sum clippy.log tests.log Cargo.lock receipt.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-http-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: host-http-evidence/
          if-no-files-found: error

  standalone-https:
    name: Android standalone HTTPS (x86_64 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_TARGET: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure probe toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk"
          tools="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$tools/x86_64-linux-android${ANDROID_API}-clang"
          {
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$tools/x86_64-linux-android${ANDROID_API}-clang"
            echo "CC_x86_64_linux_android=$tools/x86_64-linux-android${ANDROID_API}-clang"
            echo "CXX_x86_64_linux_android=$tools/x86_64-linux-android${ANDROID_API}-clang++"
            echo "AR_x86_64_linux_android=$tools/llvm-ar"
          } >> "$GITHUB_ENV"
          mkdir -p android-http-evidence
          {
            echo "source=$GITHUB_SHA"
            echo "target=$ANDROID_TARGET"
            echo "ndk_api=$ANDROID_API"
            echo "emulator_api=35"
            echo "scope=standalone HTTP helper, not ARM64 server runtime"
            cat "$ndk/source.properties"
            rustc -Vv
          } > android-http-evidence/receipt.txt
          rustup target add "$ANDROID_TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64-api24-http-probe

      - name: Build standalone Android HTTPS probe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --no-default-features --example android_http_probe --target "$ANDROID_TARGET" 2>&1 | tee android-http-evidence/build.log
          cp Cargo.lock android-http-evidence/Cargo.lock
          sha256sum "target/$ANDROID_TARGET/release/examples/android_http_probe" >> android-http-evidence/receipt.txt

      - name: Prepare self-signed TLS endpoint and emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=android-http-probe -addext subjectAltName=IP:10.0.2.2 -keyout android-http-evidence/test-key.pem -out android-http-evidence/test-cert.pem
          cat > android-http-evidence/tls-server.py <<'PY'
          import http.server, ssl
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain('android-http-evidence/test-cert.pem', 'android-http-evidence/test-key.pem')
          server = http.server.HTTPServer(('0.0.0.0', 38443), http.server.BaseHTTPRequestHandler)
          server.socket = context.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PY
          nohup python3 android-http-evidence/tls-server.py > android-http-evidence/tls-server.log 2>&1 &
          echo "$!" > android-http-evidence/tls-server.pid
          cat > android-http-evidence/run-probe.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell getprop ro.build.version.sdk | tee android-http-evidence/device-api.txt
          adb shell getprop ro.product.cpu.abi | tee android-http-evidence/device-abi.txt
          test "$(tr -d '\r\n' < android-http-evidence/device-api.txt)" = 35
          test "$(tr -d '\r\n' < android-http-evidence/device-abi.txt)" = x86_64
          adb push target/x86_64-linux-android/release/examples/android_http_probe /data/local/tmp/mcsa-http-probe
          adb shell chmod 755 /data/local/tmp/mcsa-http-probe
          adb shell /data/local/tmp/mcsa-http-probe https://10.0.2.2:38443/ 2>&1 | tee android-http-evidence/probe.log
          test "$(grep -c '^PASS:' android-http-evidence/probe.log)" = 3
          (cd android-http-evidence && sha256sum receipt.txt Cargo.lock build.log probe.log device-api.txt device-abi.txt > SHA256SUMS)
          SH

      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android-http-evidence/run-probe.sh

      - name: Stop test TLS endpoint
        if: always()
        shell: bash
        run: |
          if [ -f android-http-evidence/tls-server.pid ]; then
            kill "$(cat android-http-evidence/tls-server.pid)" || true
          fi
          rm -f android-http-evidence/test-key.pem

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-standalone-https-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-http-evidence/
          if-no-files-found: error
