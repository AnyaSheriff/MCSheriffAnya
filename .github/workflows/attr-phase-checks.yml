name: Attribute phase with full robots 26.3

on:
  push:
    branches: ['wip/attr-phase-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: attr-phase-checks-26.3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  attribute-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test orchestration without Minecraft
        run: |
          mkdir -p "$RUNNER_TEMP/attr-phase-output"
          node --test tools/blackbox/*.test.js 2>&1 | tee "$RUNNER_TEMP/attr-phase-output/node-tests.log"
          python -m unittest discover -s tools/blackbox -p test_attr_phase_ci.py -v 2>&1 | tee "$RUNNER_TEMP/attr-phase-output/python-tests.log"
          python -m unittest discover -s tools/blackbox -p test_combat_ci.py -v 2>&1 | tee "$RUNNER_TEMP/attr-phase-output/shared-orchestration-tests.log"
          node --check tools/blackbox/bot.js
          node --check tools/blackbox/via_ticks.js
      - name: Resolve exact verified runtime
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/blackbox/attr_phase_ci.py pin --output "$RUNNER_TEMP/attr-phase-output"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pin.outputs.build_run_id }}
          name: ${{ steps.pin.outputs.artifact_name }}
          path: ${{ runner.temp }}/attr-phase-build
      - name: Install locked robot dependencies without lifecycle scripts
        timeout-minutes: 4
        run: |
          mkdir -p "$RUNNER_TEMP/attr-phase-node"
          cp tools/blackbox/ci/attr-phase/package*.json "$RUNNER_TEMP/attr-phase-node/"
          npm ci --prefix "$RUNNER_TEMP/attr-phase-node" --ignore-scripts --omit=dev --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/attr-phase-output/npm-install.log"
      - name: Six fresh symmetric comparisons through full bot setup
        timeout-minutes: 34
        run: |
          python tools/blackbox/attr_phase_ci.py run \
            --artifact "$RUNNER_TEMP/attr-phase-build" \
            --work "$RUNNER_TEMP/attr-phase-work" \
            --output "$RUNNER_TEMP/attr-phase-output" \
            --java "$JAVA_HOME/bin/java" \
            --modules "$RUNNER_TEMP/attr-phase-node/node_modules"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attr-phase-777-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attr-phase-output/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
