name: Generation census 26.3

on:
  push:
    branches: [migration/java-26.3]
    paths:
      - .github/workflows/generation-census.yml
      - tools/measure/genaudit_263_ci.py
      - tools/measure/test_genaudit_263_ci.py
      - testdata/world-profile/genaudit-26.3/ci-reference-pass2.json*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-census-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    # Standard public-repository runner; no paid/larger runner labels.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/measure/genaudit_263_requirements.txt
      - name: Check orchestration
        run: python -m unittest discover -s tools/measure -p test_genaudit_263_ci.py
      - name: Build runtime and fresh helper library
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/census-target
        run: |
          mkdir -p "$RUNNER_TEMP/census-build"
          cargo build --release > "$RUNNER_TEMP/census-build/runtime-build.log" 2>&1
          cargo build --release --locked -p seedmap-core --lib > "$RUNNER_TEMP/census-build/helper-library.log" 2>&1
          cp "$CARGO_TARGET_DIR/release/mcsheriffanya" "$RUNNER_TEMP/census-build/"
          cp Cargo.lock "$RUNNER_TEMP/census-build/"
          python tools/measure/genaudit_263_build_starts.py --release-deps "$CARGO_TARGET_DIR/release/deps" --output "$RUNNER_TEMP/census-build/genaudit-starts" > "$RUNNER_TEMP/census-build/helper-build.log" 2>&1
          python tools/measure/genaudit_263_ci.py --bundle --build "$RUNNER_TEMP/census-build"
      - uses: actions/upload-artifact@v4
        with:
          name: census-build
          path: |
            ${{ runner.temp }}/census-build/mcsheriffanya
            ${{ runner.temp }}/census-build/genaudit-starts
            ${{ runner.temp }}/census-build/Cargo.lock
            ${{ runner.temp }}/census-build/build.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-build-logs
          path: ${{ runner.temp }}/census-build/*.log
          retention-days: 3

  census:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        label: [owner, second]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/measure/genaudit_263_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: census-build
          path: ${{ runner.temp }}/census-build
      - name: Generate and measure fixed census windows
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p "$RUNNER_TEMP/census-reports"
          python -u tools/measure/genaudit_263_ci.py --build "$RUNNER_TEMP/census-build" --label "$LABEL" --scratch "$RUNNER_TEMP/census-worlds" --output "$RUNNER_TEMP/census-reports" > "$RUNNER_TEMP/census-reports/analysis.log" 2>&1
          cat "$RUNNER_TEMP/census-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Compress reports and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/census-upload"
          python - <<'PY'
          import gzip, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP'])
          for path in (folder/'census-reports').glob('*'):
              if path.is_file() and path.suffix in ('.json', '.md', '.log'):
                  (folder/'census-upload'/(path.name+'.gz')).write_bytes(gzip.compress(path.read_bytes(),mtime=0))
          # Server logs only; generated regions, level files and worlds are excluded.
          for index,path in enumerate(sorted((folder/'census-worlds/worlds').glob('*/server.out'))):
              (folder/'census-upload'/f'server-{index}.log.gz').write_bytes(gzip.compress(path.read_bytes(),mtime=0))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-${{ matrix.label }}
          path: ${{ runner.temp }}/census-upload/*
          retention-days: 3
          if-no-files-found: warn
