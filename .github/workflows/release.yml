name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: mcsa-linux-x64-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: mcsa-linux-arm64, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: mcsa-linux-x64, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: mcsa-windows-x64, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, name: mcsa-macos-arm64, archive: tar.gz }
          # Отдельного Intel-раннера нет: собираем кросс-сборкой на arm64.
          - { os: macos-latest, target: x86_64-apple-darwin, name: mcsa-macos-x64, archive: tar.gz }
    steps:
      - name: Preserve pinned source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use the locally verified release lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch-release-lock.py

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install NASM (Windows, for aws-lc)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Package
        shell: bash
        run: |
          NAME="${{ matrix.name }}"
          mkdir "$NAME"
          BIN=mcsheriffanya
          [ "${{ runner.os }}" = "Windows" ] && BIN=mcsheriffanya.exe
          LOCAL_BIN=mcsa
          [ "${{ runner.os }}" = "Windows" ] && LOCAL_BIN=mcsa.exe
          cp "target/${{ matrix.target }}/release/$BIN" "$NAME/$LOCAL_BIN"
          RAW="$NAME.bin"
          [ "${{ runner.os }}" = "Windows" ] && RAW="$NAME.exe"
          cp "target/${{ matrix.target }}/release/$BIN" "$RAW"
          cp README.md README_ru.md LICENSE "$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python - "$NAME/start.cmd" <<'PYWINDOWS'
          import pathlib, sys
          lines = [
              '@echo off', 'setlocal', 'cd /d "%~dp0"',
              'if not exist "mcsa.exe" (',
              '  echo mcsa.exe was not found. Extract the complete ZIP first.',
              '  pause', '  exit /b 1', ')',
              '"%~dp0mcsa.exe" %*', 'set "MCSA_EXIT=%ERRORLEVEL%"',
              'echo.', 'echo MCSA exited with code %MCSA_EXIT%.',
              'pause', 'exit /b %MCSA_EXIT%',
          ]
          pathlib.Path(sys.argv[1]).write_bytes(('\r\n'.join(lines) + '\r\n').encode('ascii'))
          PYWINDOWS
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          echo "ASSET=$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"
          echo "RAW_ASSET=$RAW" >> "$GITHUB_ENV"
          python - "$RAW" "$NAME.${{ matrix.archive }}" "checksums-${{ matrix.name }}.txt" <<'PY'
          import hashlib, pathlib, sys
          pathlib.Path(sys.argv[3]).write_text(''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in sys.argv[1:3]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.RAW_ASSET }}
            checksums-${{ matrix.name }}.txt

  launcher:
    name: Build and test own Java launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build own Java sources with strict warnings
        run: MCSA_JDK_BIN="$JAVA_HOME/bin" bash tools/jar-launcher/build.sh
      - name: Test both own launcher entry points
        run: |
          "$JAVA_HOME/bin/java" -jar tools/jar-launcher/dist/server.jar --launcher-self-test
          "$JAVA_HOME/bin/java" -cp tools/jar-launcher/dist/ServerWrapper.jar pro.gravit.launcher.server.ServerWrapper --launcher-self-test
      - uses: actions/upload-artifact@v4
        with:
          name: own-java-launcher
          path: |
            tools/jar-launcher/dist/server.jar
            tools/jar-launcher/dist/ServerWrapper.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish exact source lock and global checksums
        run: |
          python tools/fetch-release-lock.py
          cp Cargo.lock dist/Cargo.lock
          python - <<'PY_SUMS'
          import hashlib, pathlib
          directory = pathlib.Path('dist')
          files = sorted(path for path in directory.iterdir() if path.is_file())
          names = ['mcsa-windows-x64', 'mcsa-linux-x64', 'mcsa-linux-x64-gnu',
                   'mcsa-linux-arm64', 'mcsa-macos-arm64', 'mcsa-macos-x64']
          expected = {'Cargo.lock', 'server.jar', 'ServerWrapper.jar'}
          for name in names:
              raw = name + ('.exe' if name == 'mcsa-windows-x64' else '.bin')
              archive = name + ('.zip' if name == 'mcsa-windows-x64' else '.tar.gz')
              checksums = 'checksums-' + name + '.txt'
              expected.update([raw, archive, checksums])
              wanted = ''.join(hashlib.sha256((directory / filename).read_bytes()).hexdigest()
                               + '  ' + filename + '\n' for filename in [raw, archive])
              assert (directory / checksums).read_text() == wanted, 'Payload checksum mismatch'
          assert {path.name for path in files} == expected, 'Unexpected release asset inventory'
          (directory / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in files))
          PY_SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
