name: Own BlockPlace baseline only
on:
  push:
    branches: ['feature/bukkit-place-baseline-20261110']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
jobs:
  place-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B tools/plugin-translator/place_baseline_ci.py prepare
      - run: python3 -B tools/plugin-translator/place_baseline_ci.py compile
      - run: python3 -B tools/plugin-translator/place_baseline_ci.py fixtures
      - run: python3 -B tools/plugin-translator/place_baseline_ci.py tests
      - run: python3 -B tools/plugin-translator/place_baseline_ci.py verify
      - if: always()
        env:
          MCSA_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/plugin-translator/place_baseline_ci.py finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bukkit-place-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: place-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
