name: Private adjacent protocol codecs
on:
  push:
    branches: ['feature/via-adjacent-20261109']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: via-adjacent-protocol
      - name: Check pinned sources and static table contracts
        shell: bash
        run: |
          mkdir -p via-evidence
          set -o pipefail
          python3 -B -m unittest discover -s tools/protocol-bridge -p 'test_client_chain.py' -v 2>&1 | tee via-evidence/python.log
          python3 -B -m unittest discover -s tools/protocol-bridge -p 'test_public_admission_smoke.py' -v 2>&1 | tee -a via-evidence/python.log
      - name: Reproduce tables from allowed pinned JSON
        shell: bash
        run: |
          set -o pipefail
          python3 -B tools/protocol-bridge/generate_client_chain.py --cache "$RUNNER_TEMP/client-chain" --cache774 "$RUNNER_TEMP/client-chain/774" --fetch --check 2>&1 | tee via-evidence/generator.log
      - name: Test the actual protocol package
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p mcsa-protocol 2>&1 | tee via-evidence/tests.log
      - name: Strict Clippy for the actual protocol package
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --release --all-targets -p mcsa-protocol -- -D warnings 2>&1 | tee via-evidence/clippy.log
      - name: Preserve compact source and verification receipt
        if: always()
        env:
          MCSA_JOB_STATUS: ${{ job.status }}
          MCSA_RUN_ID: ${{ github.run_id }}
          MCSA_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,tarfile
          from pathlib import Path
          out=Path('via-evidence');out.mkdir(exist_ok=True)
          selected=['.github/workflows/via-adjacent-checks.yml','Cargo.toml','tools/protocol-bridge/Cargo.toml',
              'tools/protocol-bridge/src/lib.rs','tools/protocol-bridge/src/wire.rs','tools/protocol-bridge/src/items.rs',
              'tools/protocol-bridge/src/player_position.rs','tools/protocol-bridge/src/player_info.rs',
              'tools/protocol-bridge/src/slot_adjacent.rs','tools/protocol-bridge/src/generated_slot_adjacent.rs',
              'tools/protocol-bridge/generate_client_chain.py','tools/protocol-bridge/client-chain-sources.json',
              'tools/protocol-bridge/test_client_chain.py',
              'tools/protocol-bridge/testdata/player-info-768-769-layouts.json',
              'tools/protocol-bridge/testdata/slot-adjacent-layouts.json']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          with tarfile.open(out/'selected-source.tar.gz','w:gz') as archive:
              for name in selected:
                  if Path(name).is_file():archive.add(name,arcname=name)
          lock=Path('Cargo.lock')
          if lock.is_file():shutil.copyfile(lock,out/'Cargo.lock')
          sources={str(p):{'sha256':sha(p),'bytes':p.stat().st_size} for p in Path('tools/protocol-bridge/src').glob('*.rs')}
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          artifacts={p.name:{'sha256':sha(p),'bytes':p.stat().st_size} for p in out.iterdir() if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':source,'tree':tree,'job_status':os.environ['MCSA_JOB_STATUS'],
              'run_id':os.environ['MCSA_RUN_ID'],'run_attempt':os.environ['MCSA_RUN_ATTEMPT'],
              'scope':'Protocol package only; no public admission, full client or gameplay claim',
              'rust_sources':sources,'artifacts':artifacts},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-adjacent-${{ github.run_id }}-${{ github.run_attempt }}
          path: via-evidence/
          retention-days: 7
          if-no-files-found: warn
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: via-workspace-integration
      - name: Prepare workspace logs and plugin example target
        run: |
          mkdir -p via-workspace-evidence
          rustup target add wasm32-wasip2
      - name: Build own plugin examples required by workspace tests
        working-directory: plugins-examples
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target wasm32-wasip2 2>&1 | tee ../via-workspace-evidence/plugin-examples.log
      - name: Strict Clippy for the complete workspace
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --release --all-targets --workspace -- -D warnings 2>&1 | tee via-workspace-evidence/clippy.log
      - name: Test the complete workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --workspace 2>&1 | tee via-workspace-evidence/tests.log
      - name: Test without default features
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --no-default-features 2>&1 | tee via-workspace-evidence/no-default-tests.log
      - name: Build actual release runtime
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee via-workspace-evidence/build.log
      - name: Fresh existing client routes through the actual runtime
        shell: bash
        run: |
          set -o pipefail
          python3 -B - <<'PY' 2>&1 | tee via-workspace-evidence/public-driver.log
          import json,os,subprocess,sys
          from pathlib import Path
          tools=Path('tools/protocol-bridge').resolve();sys.path.insert(0,str(tools))
          from generate_client_chain import load
          from generate_registry_26_2 import CANDIDATE,DEFAULT_OUTPUT,Sources
          temporary=Path(os.environ['RUNNER_TEMP'])
          cache=temporary/'via-client-chain'
          load(cache,cache/'774',True)
          registry=temporary/'via-registry-776'
          sources=Sources(registry,True,json.loads(DEFAULT_OUTPUT.read_text())['sources'])
          for kind in ['protocol','entities','items']:
              sources.read(CANDIDATE,'data/pc/26.2/'+kind+'.json')
          protocol776=registry/CANDIDATE[1]/'data/pc/26.2/protocol.json'
          command=['python3','-B',str(tools/'probe_public_776.py'),
              '--binary',str(Path('target/release/mcsheriffanya').resolve()),
              '--protocol',str(protocol776),'--cache',str(registry),'--primary','777',
              '--port','26184','--output',str(Path('via-workspace-evidence/public777').resolve())]
          for version in range(769,775):
              command += [f'--protocol{version}',str(cache/str(version)/'protocol.json'),
                  f'--cache{version}',str(cache/str(version)),f'--admit{version}']
          # Только отдельная сеть GitHub runner; PC/live25565 не используются.
          subprocess.run(['sudo','unshare','--net','--','bash','-c',
              'ip link set lo up; exec "$@"','via-isolated-net',*command],check=True)
          result=json.loads(Path('via-workspace-evidence/public777/result.json').read_text())
          assert result['status']=='pass' and len(result['checks'])==21
          assert len(result['sessions'])==7
          assert {row['client'] for row in result['sessions']}==set(range(769,775))|{776}
          assert all(row['admitted'] and row['primary']=='26.3' and len(row['inventory'])==46 for row in result['sessions'])
          assert all(row['exit']==0 and row['port_free'] and row['process_group_gone'] for row in result['shutdown'])
          print(json.dumps({'status':'pass','clients':7,'checks':21,'primary':777}))
          PY
      - name: Preserve compact integration evidence
        if: always()
        env:
          MCSA_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          out=Path('via-workspace-evidence');out.mkdir(exist_ok=True)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          selected=['.github/workflows/via-adjacent-checks.yml','tools/protocol-bridge/probe_public_776.py',
              'tools/protocol-bridge/test_public_admission_smoke.py']
          with tarfile.open(out/'selected-source.tar.gz','w:gz') as archive:
              for path in selected:archive.add(path,arcname=path)
          binary=Path('target/release/mcsheriffanya')
          files={str(p.relative_to(out)):{'sha256':sha(p),'bytes':p.stat().st_size} for p in out.rglob('*') if p.is_file()}
          rust={str(p):sha(p) for folder in ['src','tools/protocol-bridge/src'] for p in Path(folder).rglob('*.rs')}
          receipt={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'status':os.environ['MCSA_JOB_STATUS'],'files':files,'rust_sources':rust,
              'runtime':{'sha256':sha(binary),'bytes':binary.stat().st_size} if binary.is_file() else None,
              'scope':'Whole workspace plus fresh existing public routes769-774/776 on primary777; no new admission'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: via-workspace-evidence/
          retention-days: 7
          if-no-files-found: warn
