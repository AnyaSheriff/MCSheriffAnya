name: One original player data layout calibration
on:
  push:
    branches: ['probe/player-data-layout-20261110']
permissions:
  contents: read
jobs:
  original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Offline transport and fresh CLI guards
        run: python3 -B -m unittest discover -s tools/blackbox/player_data_layout -p 'test_*.py' -v
      - name: One original only finite layout capture
        run: python3 -B tools/blackbox/player_data_layout/calibrate.py --output layout-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-data-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            layout-evidence/*.json
            layout-evidence/*.txt
            layout-evidence/own-source.tar.gz
            layout-evidence/FIRST-ORIGINAL/
            layout-evidence/data/
            layout-evidence/original/server.log
          retention-days: 7
