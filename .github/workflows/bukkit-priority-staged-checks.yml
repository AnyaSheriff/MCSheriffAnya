name: Staged native Bukkit BlockBreak prototype
on:
  push:
    branches: ['feature/bukkit-priority-staged-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '4'
jobs:
  optional-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: Swatinem/rust-cache@v2
      - name: Compile all actual Rust targets first
        run: |
          mkdir -p staged-evidence
          set -o pipefail
          cargo check --release --all-targets 2>&1 | tee staged-evidence/check.log
      - name: Parse cross-package WIT and generate actual C API
        run: |
          mkdir -p staged-evidence
          set -o pipefail
          python3 -B tools/plugin-translator/check-priority-wit.py 2>&1 | tee staged-evidence/wit.log
      - name: Build two unchanged own fixture JARs and translate optional world
        run: |
          set -o pipefail
          python3 -B tools/plugin-translator/build-priority-fixtures.py 2>&1 | tee staged-evidence/fixtures.log
          mkdir -p staged-evidence/sdk-inputs
          for letter in a b; do
            python3 -B tools/plugin-translator/translate.py tools/plugin-translator/target/priority-$letter.jar --staged-block-break --output tmp/java-priority-staged/plugins 2>&1 | tee staged-evidence/translate-$letter.log
            cp tools/plugin-translator/target/mcsa-bukkit.jar staged-evidence/sdk-inputs/sdk-$letter.jar
          done
          python3 -B tools/plugin-translator/build-priority-safety.py 2>&1 | tee staged-evidence/safety-fixtures.log
          for suffix in observer mutator empty failed; do
            python3 -B tools/plugin-translator/translate.py tools/plugin-translator/target/priority-$suffix.jar --staged-block-break --output tmp/java-priority-staged/plugins 2>&1 | tee staged-evidence/translate-$suffix.log
            cp tools/plugin-translator/target/mcsa-bukkit.jar staged-evidence/sdk-inputs/sdk-$suffix.jar
          done
          python3 -B tools/plugin-translator/build-priority-faults.py 2>&1 | tee staged-evidence/translate-fault.log
          cp tools/plugin-translator/target/mcsa-bukkit.jar staged-evidence/sdk-inputs/sdk-fault.jar
      - name: Verify immutable old components and build mixed inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/plugin-translator/priority_staged_ci.py inputs
      - name: Actual Rust budget contracts and staged host
        run: |
          set -o pipefail
          cargo test --release --bin mcsheriffanya plugins::priority::tests -- --nocapture --test-threads=1 2>&1 | tee staged-evidence/budget.log
          for test in translated_bukkit_staged_partial_and_wrong_type_are_not_legacy translated_bukkit_staged_faults_and_cumulative_native_budgets translated_bukkit_staged_monitor_epoch_nested_trap_and_empty translated_bukkit_staged_empty_fuel_quarantines_and_reload_is_fresh translated_bukkit_staged_priority_contract translated_bukkit_staged_frames_reject_invalid_order_replay_and_capacity translated_bukkit_staged_mixed_a_uses_full_legacy_fallback translated_bukkit_staged_mixed_b_uses_full_legacy_fallback translated_bukkit_legacy_priority_baseline translated_bukkit_jars translated_bukkit_listener_unregistration translated_bukkit_enchantment_removal_reaches_native_inventory; do
            timeout 180s cargo test --release --bin mcsheriffanya plugins::tests::$test -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee staged-evidence/$test.log
          done
      - name: Preserve compact source raw and receipts even after failure
        if: always()
        env:
          MCSA_JOB_STATUS: ${{ job.status }}
        run: python3 -B tools/plugin-translator/priority_staged_ci.py finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-prototype-${{ github.run_id }}
          path: staged-evidence/
          include-hidden-files: true
          retention-days: 7
  old-host-new-components:
    needs: optional-abi
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 354a0d137b60dbd89d32246c3e0aef2ddbd062c1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staged-prototype-${{ github.run_id }}
          path: candidate-artifact
      - uses: Swatinem/rust-cache@v2
      - name: Install exact new components into actual frozen old Host checkout
        run: |
          mkdir -p tmp/java-priority-baseline/plugins old-host-evidence
          cp -r candidate-artifact/java-priority-staged/plugins/java-priority-a tmp/java-priority-baseline/plugins/
          cp -r candidate-artifact/java-priority-staged/plugins/java-priority-b tmp/java-priority-baseline/plugins/
          git rev-parse HEAD > old-host-evidence/source.txt
          sha256sum tmp/java-priority-baseline/plugins/*/plugin.wasm > old-host-evidence/components.sha256
      - name: Execute old Host legacy baseline on exact new components
        run: |
          set -o pipefail
          cargo test --release --bin mcsheriffanya plugins::tests::translated_bukkit_legacy_priority_baseline -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee old-host-evidence/native.log
      - name: Preserve actual old source proof lock and capture
        if: always()
        run: |
          mkdir -p old-host-evidence
          test ! -f Cargo.lock || cp Cargo.lock old-host-evidence/Cargo.lock
          test ! -d tmp/java-priority-baseline || cp -r tmp/java-priority-baseline old-host-evidence/native
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          out=Path('old-host-evidence')
          files={str(p.relative_to(out)):{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in out.rglob('*') if p.is_file()}
          (out/'receipt.json').write_text(json.dumps({'source':'354a0d137b60dbd89d32246c3e0aef2ddbd062c1','files':files},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-old-host-${{ github.run_id }}
          path: old-host-evidence/
          retention-days: 7
