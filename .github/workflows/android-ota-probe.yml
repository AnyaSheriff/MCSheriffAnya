name: Android core OTA loader proof
on:
  push:
    branches: ['wip/apk-ota-probe-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated native loader proof
        run: |
          set -euo pipefail
          bash tools/android/build-ota-probe.sh
          (cd android && ./gradlew --no-daemon -PotaProbe=true -PapkAbi=x86_64 :ota-probe:assembleDebug :ota-probe:assembleDebugAndroidTest :ota-probe:lintDebug)
          mkdir -p ota-probe-apk
          cp android/ota-probe/build/outputs/apk/debug/*.apk ota-probe-apk/app.apk
          cp android/ota-probe/build/outputs/apk/androidTest/debug/*.apk ota-probe-apk/test.apk
          cp android/ota-probe/build/reports/lint-results-debug.* ota-probe-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-probe-build-${{ github.run_id }}
          path: |
            ota-probe-native/
            ota-probe-apk/
          retention-days: 7
  device:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ota-probe-build-${{ github.run_id }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p ota-probe-device
            adb install -r ota-probe-apk/app.apk
            adb install -r ota-probe-apk/test.apk
            adb shell am instrument -w ru.sheriffanya.mcsa.otaprobe.test/androidx.test.runner.AndroidJUnitRunner | tee ota-probe-device/instrumentation.txt
            grep -q 'OK (1 test)' ota-probe-device/instrumentation.txt
            adb exec-out run-as ru.sheriffanya.mcsa.otaprobe cat files/probe-result.json > ota-probe-device/probe-result.json
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ota-probe-device
          adb logcat -d > ota-probe-device/logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-probe-api${{ matrix.api }}-${{ github.run_id }}
          path: ota-probe-device/
          retention-days: 7
