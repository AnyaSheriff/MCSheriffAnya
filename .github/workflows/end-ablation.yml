name: End generation experiment

on:
  push:
    branches: ['wip/end-ablation-*']
    paths:
      - .github/workflows/end-ablation.yml
      - tools/measure/genaudit_263_end_ci.py
      - tools/measure/test_genaudit_263_end_ci.py
      - testdata/world-profile/genaudit-26.3/end-control-pass3.json*
      - src/world/end_island_shapes_26_3.rs
      - testdata/world-profile/genaudit-26.3/end-island-shapes*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: end-ablation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  variant:
    # Каждый вариант имеет отдельную стандартную VM и свежий target.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [A, E]
    env:
      VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inputs and orchestration
        run: |
          mkdir -p "$RUNNER_TEMP/end-build" "$RUNNER_TEMP/end-reports"
          python -m pip install -r tools/measure/genaudit_263_requirements.txt
          python -m unittest discover -s tools/measure -p test_genaudit_263_end_ci.py -v 2>&1 | tee "$RUNNER_TEMP/end-build/tests.log"
          python -m unittest discover -s tools/measure -p test_genaudit_263_end_edges.py -v 2>&1 | tee "$RUNNER_TEMP/end-build/edges-tests.log"
      - name: Build experimental runtime and matching helper
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/end-target
        run: |
          python tools/measure/genaudit_263_end_ci.py --prepare-variant "$VARIANT"
          git diff -- src/world/the_end.rs > "$RUNNER_TEMP/end-build/source.patch"
          cargo build --release > "$RUNNER_TEMP/end-build/runtime-build.log" 2>&1
          cargo build --release --locked -p seedmap-core --lib > "$RUNNER_TEMP/end-build/helper-library.log" 2>&1
          cp "$CARGO_TARGET_DIR/release/mcsheriffanya" "$RUNNER_TEMP/end-build/"
          cp Cargo.lock "$RUNNER_TEMP/end-build/"
          python tools/measure/genaudit_263_build_starts.py --release-deps "$CARGO_TARGET_DIR/release/deps" --output "$RUNNER_TEMP/end-build/genaudit-starts" > "$RUNNER_TEMP/end-build/helper-build.log" 2>&1
          python tools/measure/genaudit_263_end_ci.py --bundle --variant "$VARIANT" --build "$RUNNER_TEMP/end-build"
      - name: Test measured island geometry
        if: matrix.variant == 'E'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/end-target
        run: |
          cargo test --release -p seedmap-core observed_islands -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/end-build/island-tests.log"
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP'])/'end-build/island-tests.log').read_text()
          rows = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed;', text)
          assert rows and sum(int(n) for n,_ in rows) > 0, 'Measured geometry tests did not run'
          assert all(int(n) == 0 for _,n in rows)
          PY
      - name: Measure both seeds in the End only
        run: |
          for label in owner second; do
            mkdir -p "$RUNNER_TEMP/end-reports/$label"
            python -u tools/measure/genaudit_263_end_ci.py --execute --variant "$VARIANT" --label "$label" --build "$RUNNER_TEMP/end-build" --output "$RUNNER_TEMP/end-reports/$label" --scratch "$RUNNER_TEMP/end-worlds-$label" > "$RUNNER_TEMP/end-reports/$label/analysis.log" 2>&1
          done
      - name: Preserve compact evidence
        if: always()
        run: |
          python - <<'PY'
          import gzip, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = root/'end-upload'
          output.mkdir(exist_ok=True)
          for path in (root/'end-reports').rglob('*'):
              if path.is_file() and path.suffix in ('.json','.log','.md'):
                  target = output/path.relative_to(root/'end-reports')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.with_name(target.name+'.gz').write_bytes(gzip.compress(path.read_bytes(),mtime=0))
          for label in ('owner','second'):
              folder = output/label
              folder.mkdir(exist_ok=True)
              for i,path in enumerate(sorted((root/f'end-worlds-{label}/worlds').glob('*/server.out'))):
                  (folder/f'server-{i}.log.gz').write_bytes(gzip.compress(path.read_bytes(),mtime=0))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: end-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/end-build/
            ${{ runner.temp }}/end-upload/
          retention-days: 3
          if-no-files-found: error
