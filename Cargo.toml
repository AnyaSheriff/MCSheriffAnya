[package]
name = "mcsheriffanya"
version = "0.1.0-alpha"
edition = "2024"
license = "MIT"
description = "A Minecraft-compatible game server written from scratch in Rust"
repository = "https://github.com/MCSheriffAnya-Rust/MCSheriffAnya"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
flate2 = "1"
zstd = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "charset", "multipart"] }
md-5 = "0.10"
# Проверка подписей входа Xbox Live (RS256, ES384). Та же библиотека уже
# стоит под rustls у reqwest — с теми же возможностями, без новой сборки.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

# Местное время без libc на Windows (там нет localtime_r).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Time"] }
