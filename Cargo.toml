[package]
name = "mcsheriffanya"
default-run = "mcsheriffanya"
version = "0.2.7-alpha"
edition = "2024"
license = "MIT"
description = "A Minecraft-compatible game server written from scratch in Rust"
repository = "https://github.com/MCSheriffAnya-Rust/MCSheriffAnya"

exclude = ["plugins-examples/**"]

[features]
# Плагины WebAssembly входят в обычную сборку. Отключить:
# cargo build --release --no-default-features (без /plugman и папок плагинов).
default = ["plugins"]
plugins = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
seedmap-core = { path = "tools/seedmap" }
png = "0.17"
font8x8 = "0.3"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
flate2 = "1"
zstd = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "charset", "multipart"] }
md-5 = "0.10"
zeroize = "1"
rsa = { version = "0.9.8", default-features = false, features = ["std"] }
aes = "0.8.4"
cfb8 = "0.8.1"
sha1 = "0.10.6"
# Проверка подписей входа Xbox Live (RS256, ES384). Та же библиотека уже
# стоит под rustls у reqwest — с теми же возможностями, без новой сборки.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

# Исполнитель плагинов: wasmtime с моделью компонентов (WIT). Только то, что
# нужно: исполнение, компилятор cranelift, компоненты. WASI только Preview 2;
# он сам включает wasmtime/async даже для синхронного линкера. Без кэша,
# профилирования, WAT, GC и остальных возможностей по умолчанию.
wasmtime = { version = "=49.0.2", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wasmtime-wasi = { version = "=49.0.2", optional = true, default-features = false, features = ["p2"] }

# Местное время без libc на Windows (там нет localtime_r).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Time"] }

[workspace]
members = ["tools/seedmap"]

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seedmap_core)'] }

# Скорость загрузки и вызовов важнее размера: обычный release opt-level=3,
# без переопределений по размеру для Cranelift, Wasmtime и WASI.
# Убираем только символы; машинный код и настройки JIT не меняются.
[profile.release]
strip = "symbols"
