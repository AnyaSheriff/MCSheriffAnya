[package]
name = "rustcraft"
version = "0.0.1-alpha"
edition = "2024"
license = "MIT"
description = "A Minecraft-compatible game server written from scratch in Rust"
repository = "https://github.com/AnyaSheriff/RustCraft"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "charset"] }
