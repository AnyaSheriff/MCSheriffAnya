[package]
name = "seedmap-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seedmap_core)'] }
